<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Osmo Action</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#141719;color:#e9edef}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:0 auto;padding:24px 16px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0 0 18px}.sub,.note{color:#a5b1b7;font-size:14px}.card{background:#1e2427;border:1px solid #344047;border-radius:12px;padding:22px;margin:18px 0}.row{display:flex;justify-content:space-between;gap:12px;margin:10px 0;flex-wrap:wrap}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;color:inherit;background:#131a1e;border:1px solid #53636c;border-radius:6px;padding:10px}input{width:100%}select{max-width:140px}button{cursor:pointer;min-height:44px}button.primary{background:#265c46;border-color:#438361}button.stop{background:#593432;border-color:#885652}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.message{min-height:25px;overflow-wrap:anywhere}.ok{color:#81d8a3}.warn{color:#edc080}code{overflow-wrap:anywhere}a{color:#a7d5ee}:focus-visible{outline:3px solid #95c8e7;outline-offset:3px}@media(max-width:480px){.card{padding:16px}.actions button{flex:1 1 42%}}
</style></head><body><main>
<header><div><h1>Osmo Action</h1><div class="sub" data-i18n="subtitle"></div></div><select id="language" aria-label="Language / 语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></header>
<section class="card" aria-labelledby="stream-title"><h2 id="stream-title" data-i18n="streamTitle"></h2>
<div class="row"><span data-i18n="streamState"></span><strong id="stream-state"></strong></div>
<div class="note" id="stream-detail"></div><div class="note" id="stream-updated"></div>
<label for="url" data-i18n="url"></label><input id="url" autocomplete="off" spellcheck="false" maxlength="199" placeholder="rtmp://server/app/stream">
<label for="rate" data-i18n="rate"></label><input id="rate" type="number" min="500" max="6000" step="1" value="2000">
<p class="note" id="dirty"></p><div class="actions"><button id="save" data-i18n="save" disabled></button><button id="refresh" data-i18n="refresh" disabled></button><button class="primary" id="start" data-i18n="start" disabled></button><button class="stop" id="stop" data-i18n="stop" disabled></button></div>
<p class="message" id="stream-msg" role="status" aria-live="polite"></p><p class="note" data-i18n="manual"></p><p class="note" id="playback"></p>
</section>
<section class="card" aria-labelledby="network-title"><h2 id="network-title" data-i18n="networkTitle"></h2>
<div class="row"><span data-i18n="owner"></span><strong id="network-owner"></strong></div><div class="row"><span data-i18n="address"></span><span id="address">—</span></div>
<label for="sta" data-i18n="nextBoot"></label><select id="sta" disabled><option value="on" data-i18n="staOn"></option><option value="off" data-i18n="staOff"></option></select>
<div class="actions"><button id="network-save" data-i18n="saveSwitch" disabled></button><button id="network-refresh" data-i18n="refresh"></button></div>
<p class="message" id="network-msg" role="status" aria-live="polite"></p><p class="note warn" id="pending"></p>
<p class="note" data-i18n="cardNote"></p><p class="note" data-i18n="offNote"></p><p class="note" data-i18n="recovery"></p>
</section><p class="note" data-i18n="version"></p>
</main><script>
'use strict';
const strings={
'zh-CN':{subtitle:'相机管理',streamTitle:'RTMP 推流',streamState:'相机报告状态',url:'推流地址',rate:'视频码率（kbps）',save:'保存配置',refresh:'刷新状态',start:'启动推流',stop:'停止推流',manual:'开机不会自动推流。请先启动接收服务器，再手动启动推流；相机报告的状态不代表 OBS 已收到画面。',networkTitle:'Wi-Fi 管理',owner:'本次开机的 Wi-Fi 管理',address:'当前无线地址',nextBoot:'下次开机',staOn:'启用 STA',staOff:'交回原厂系统',saveSwitch:'保存开关',cardNote:'STA 使用内存卡根目录的 wifi.conf 连接路由器。网络名称和密码只在该文件中设置；自定义 AP 模式已取消。',offNote:'开关在完全关机、再开机后生效。关闭 STA 后，原厂系统接管 Wi-Fi；当前路由器地址将不可用，原厂配对功能仍可使用。',recovery:'重新启用 STA：关机后删除内存卡根目录的 OA_STA_DISABLE 文件，确认 wifi.conf 有效，再开机。若有旧的 NO_WIFI 文件，也需删除。',version:'固件 v20 · 推流手动启动 · 简体中文 / English',unknown:'尚未确认',running:'推流中',stopped:'已停止',dirty:'有未保存的修改，请先保存再启动。',clean:'保存后，下次启动推流时应用；不会自动重启当前推流。',loading:'正在加载…',working:'正在处理…',saved:'配置已保存，下次启动推流时生效。',confirmed:'相机已确认命令，请在接收端确认画面。',statusRead:'状态已更新。',switchSaved:'开关已保存。请正常关机，再开机使其生效。',pending:'开关已变更，等待完整关机、再开机。',sta:'自定义 STA',system:'原厂系统',updated:'最近确认：',seconds:'秒',lowdelay:'OBS 低延迟地址：rtmp://192.168.100.6:1935/live/osmo-lowdelay（需要电脑接收与修正服务）',customTarget:'请在目标服务器确认收流；电脑低延迟修正服务只处理默认推流地址。',networkError:'连接失败或超时，请检查网络并刷新状态；不要假定操作成功。',error:'操作失败。',not_ready:'控制服务尚未就绪，请稍后刷新。',method:'不支持的请求方式。',content_type:'请求格式错误。',forbidden:'页面令牌或来源无效，请刷新整个网页。',length:'请求长度错误。',invalid:'配置无效，请检查地址和码率。',lock:'无法取得控制锁。',busy:'另一项操作正在进行，请稍后重试。',save_failed:'保存失败，未确认配置已写入。',bridge_missing:'相机控制服务尚未就绪，请稍后重试。',debug_log:'无法准备状态日志。',random:'无法生成请求。',write_failed:'无法提交命令。',rejected:'相机拒绝命令。',timeout:'相机未确认命令，请刷新状态核实。',bad_reply:'相机返回了无法识别的状态。',already_running:'正在推流；请先停止再应用新配置。',card_missing:'未检测到内存卡，无法保存开关。',config_invalid:'wifi.conf 缺失或无效，请检查 ESSID 和 PASSWORD。',legacy_disabled:'请先删除内存卡上的旧 NO_WIFI 文件。'},
en:{subtitle:'Camera management',streamTitle:'RTMP streaming',streamState:'Camera-reported status',url:'Stream URL',rate:'Video bitrate (kbps)',save:'Save settings',refresh:'Refresh status',start:'Start stream',stop:'Stop stream',manual:'Streaming never starts automatically. Start your receiver first, then start the stream here. Camera status does not confirm that OBS is receiving video.',networkTitle:'Wi-Fi management',owner:'Wi-Fi owner this boot',address:'Current wireless address',nextBoot:'Next boot',staOn:'Enable STA',staOff:'Use stock system',saveSwitch:'Save switch',cardNote:'STA connects to your router using wifi.conf in the SD card root. Set the network name and password only in that file. Custom AP mode has been removed.',offNote:'Changes apply after a full power-off and power-on. With STA off, the stock system manages Wi-Fi. The current router address will no longer work; stock pairing remains available.',recovery:'To enable STA again, power off, delete OA_STA_DISABLE from the SD card root, check wifi.conf, and power on. Delete the legacy NO_WIFI file too if present.',version:'Firmware v20 · Manual streaming · 简体中文 / English',unknown:'Not confirmed',running:'Streaming',stopped:'Stopped',dirty:'Unsaved changes. Save before starting.',clean:'Saved settings apply the next time you start streaming. The current stream is not restarted.',loading:'Loading…',working:'Working…',saved:'Settings saved for the next stream start.',confirmed:'Camera confirmed the command. Check video at the receiver.',statusRead:'Status updated.',switchSaved:'Switch saved. Fully power off and power on to apply.',pending:'Change saved; waiting for a full power-off and power-on.',sta:'Custom STA',system:'Stock system',updated:'Last confirmed: ',seconds:'s',lowdelay:'Low-latency OBS URL: rtmp://192.168.100.6:1935/live/osmo-lowdelay (requires the computer receiver and correction service)',customTarget:'Check reception on your target server. The computer latency correction service handles only the default stream URL.',networkError:'Connection failed or timed out. Check the network and refresh status; do not assume success.',error:'Operation failed.',not_ready:'Control service is not ready. Refresh shortly.',method:'Unsupported request method.',content_type:'Invalid request format.',forbidden:'Invalid page token or origin. Reload the whole page.',length:'Invalid request length.',invalid:'Invalid settings. Check the URL and bitrate.',lock:'Cannot acquire the control lock.',busy:'Another operation is running. Try again shortly.',save_failed:'Save failed; settings have not been confirmed.',bridge_missing:'Camera control service is not ready. Try again shortly.',debug_log:'Cannot prepare the status log.',random:'Cannot generate a request.',write_failed:'Cannot submit the command.',rejected:'Camera rejected the command.',timeout:'Camera did not confirm the command. Refresh status to verify.',bad_reply:'Unrecognized camera response.',already_running:'Already streaming. Stop before applying new settings.',card_missing:'SD card not found. Cannot save the switch.',config_invalid:'wifi.conf is missing or invalid. Check ESSID and PASSWORD.',legacy_disabled:'Delete the legacy NO_WIFI file from the SD card first.'}
};
const $=id=>document.getElementById(id);let lang='zh-CN';try{lang=localStorage.getItem('oa.language')||(navigator.language.startsWith('zh')?'zh-CN':'en');}catch{}if(!strings[lang])lang='zh-CN';
let token='',saved=null,busy=false,netBusy=false,network=null,stream=null,last=null,streamMsg='loading',netMsg='',detail=null;
const t=k=>strings[lang][k]||strings[lang].error;
const dirty=()=>saved&&($('url').value!==saved.url||Number($('rate').value)!==saved.bitrate);
function render(){document.documentElement.lang=lang;$('language').value=lang;document.title='Osmo Action · '+t('subtitle');document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
 $('stream-state').textContent=t(stream===true?'running':stream===false?'stopped':'unknown');$('stream-state').className=stream?'ok':'';
 $('stream-detail').textContent=stream&&detail?`${detail.elapsed} ${t('seconds')} / ${detail.bitrate} kbps`:'—';$('stream-updated').textContent=last?t('updated')+last.toLocaleTimeString(lang):'';
 $('stream-msg').textContent=t(streamMsg);$('network-msg').textContent=netMsg?t(netMsg):'';$('dirty').textContent=t(dirty()?'dirty':'clean');
 $('playback').textContent=saved?t(saved.url==='rtmp://192.168.100.6:1935/live/osmo'?'lowdelay':'customTarget'):'';
 for(const id of ['save','refresh','start','stop'])$(id).disabled=busy||!token;
 $('start').disabled=busy||!token||!!dirty()||stream===true;$('url').disabled=$('rate').disabled=busy;
 $('sta').disabled=netBusy||!network||!network.card;$('network-save').disabled=netBusy||!token||!network||!network.card;$('network-refresh').disabled=netBusy;
 $('network-owner').textContent=network?t(network.active):t('unknown');$('address').textContent=network?.ip||'—';$('pending').textContent=network?.pending?t('pending'):'';
}
async function api(path,data,timeout=40000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const r=await fetch('/cgi-bin/'+path,{cache:'no-store',signal:c.signal,...(data?{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)}:{})});const result=await r.json();if(!result.ok)throw {code:result.code||'error'};return result;}catch(e){throw {code:e.code||'networkError'};}finally{clearTimeout(timer);}}
async function run(action,automatic=false){if(busy||!token)return;busy=true;if(!automatic)streamMsg='working';render();try{const data={action,token};if(action==='save'){data.url=$('url').value.trim();data.bitrate=$('rate').value;}const r=await api('rtmp',data);if(action==='save'){saved={url:data.url,bitrate:Number(data.bitrate)};$('url').value=data.url;streamMsg='saved';}else{stream=r.streaming;detail=r;last=new Date();if(!automatic)streamMsg=action==='status'?'statusRead':'confirmed';}}catch(e){streamMsg=e.code;if(action!=='save'){stream=null;detail=null;}}finally{busy=false;render();}}
async function networkRun(save=false){if(netBusy)return;netBusy=true;netMsg=save?'working':'';render();try{network=await api('network',save?{action:$('sta').value==='on'?'enable':'disable',token}:null,10000);$('sta').value=network.enabled?'on':'off';netMsg=save?'switchSaved':'';}catch(e){netMsg=e.code;}finally{netBusy=false;render();}}
$('language').onchange=()=>{lang=$('language').value;try{localStorage.setItem('oa.language',lang);}catch{}render();};for(const id of ['url','rate'])$(id).oninput=render;
for(const action of ['save','start','stop'])$(action).onclick=()=>run(action);$('refresh').onclick=()=>run('status');$('network-save').onclick=()=>networkRun(true);$('network-refresh').onclick=()=>networkRun();
render();networkRun();api('rtmp',null,10000).then(r=>{token=r.token;saved={url:r.url,bitrate:r.bitrate};$('url').value=r.url;$('rate').value=r.bitrate;render();return run('status');}).catch(e=>{streamMsg=e.code;render();});
setInterval(()=>{if(!document.hidden)run('status',true);},30000);
</script></body></html>
